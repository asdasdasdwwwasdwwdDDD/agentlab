<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentLab · 运行流程 / Runtime Flow</title>
<style>
  :root{
    --bg:#05070c;
    --ink:#e9eefb;
    --ink2:#93a3bb;
    --ink3:#5f708a;
    --line:rgba(140,170,215,.13);
    --mono:"JetBrains Mono","Cascadia Code","SF Mono",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:var(--mono)}
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1000px 640px at 10% -10%,rgba(56,189,248,.13),transparent 62%),
      radial-gradient(920px 640px at 92% 110%,rgba(167,139,250,.13),transparent 62%),
      radial-gradient(760px 520px at 52% 42%,rgba(52,211,153,.05),transparent 72%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.021) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.021) 1px,transparent 1px);
    background-size:54px 54px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 46%,#000 38%,transparent 86%);
    mask-image:radial-gradient(ellipse at 50% 46%,#000 38%,transparent 86%);
  }

  /* ---------------- topbar ---------------- */
  .topbar{
    position:relative;z-index:30;height:62px;display:flex;align-items:center;gap:18px;
    padding:0 20px;border-bottom:1px solid rgba(140,170,215,.09);
    background:rgba(5,7,12,.62);backdrop-filter:blur(10px);
  }
  .brand{display:flex;align-items:center;gap:10px;flex:none}
  .logo{
    width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;
    background:linear-gradient(150deg,rgba(56,189,248,.22),rgba(167,139,250,.22));
    border:1px solid rgba(140,190,255,.28);color:#cfe6ff;font-size:12px;
    box-shadow:0 0 18px -6px rgba(56,189,248,.5) inset;
  }
  .t1{font-size:12px;letter-spacing:.16em;font-weight:600;color:#dbe7fb}
  .t1 span{color:#5f708a;font-weight:400}
  .t2{font-size:10.5px;color:#5f708a;margin-top:2px;letter-spacing:.02em}
  .legend{display:flex;gap:6px;margin-left:8px;flex-wrap:nowrap}
  .chip{
    display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;cursor:pointer;
    font-size:10.5px;color:#8698b1;background:rgba(255,255,255,.028);
    border:1px solid rgba(140,170,215,.12);transition:.16s;white-space:nowrap;
  }
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
  .chip:hover{color:#dbe7fb;border-color:rgba(140,190,255,.3)}
  .chip.on{color:#eaf2ff;border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
  .acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
  button{
    font:inherit;font-size:11.5px;color:#a8b8cf;background:rgba(255,255,255,.035);
    border:1px solid rgba(140,170,215,.16);border-radius:8px;padding:6px 11px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:.16s;white-space:nowrap;
  }
  button:hover{color:#eaf2ff;border-color:rgba(140,190,255,.36);background:rgba(255,255,255,.06)}
  button:active{transform:translateY(1px)}
  button.primary{
    color:#04121a;font-weight:600;
    background:linear-gradient(180deg,#8fe3ff,#4cc6e8);
    border-color:#7fd8f5;box-shadow:0 6px 20px -10px #38bdf8;
  }
  button.primary:hover{background:linear-gradient(180deg,#a6ebff,#5cd0f0);color:#04121a}
  .zoomval{font-size:10.5px;color:#5f708a;min-width:40px;text-align:center}
  .prog{font-size:10.5px;color:#5f708a;letter-spacing:.08em}

  /* ---------------- stage ---------------- */
  .stage{position:fixed;left:0;right:0;top:62px;bottom:0;z-index:1;overflow:hidden}
  #viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
  #viewport.dragging{cursor:grabbing}
  #canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .edge{fill:none;stroke:rgba(160,190,230,.44);stroke-width:1.7;stroke-linecap:round;transition:.25s}
  .edge.warm{stroke:rgba(120,215,255,.75);stroke-width:2.2;filter:drop-shadow(0 0 6px rgba(56,189,248,.45))}
  .edge.dash{stroke-dasharray:6 6;animation:flow 1.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  .elabel{font-family:var(--mono);font-size:9.5px;fill:#5f708a;letter-spacing:.06em;paint-order:stroke;stroke:#05070c;stroke-width:3.2px;stroke-linejoin:round}
  .elabel.hot{fill:#8fd9ff}

  /* ---------------- node ---------------- */
  .node{
    position:absolute;border-radius:15px;cursor:pointer;overflow:hidden;
    padding:15px 17px 13px;display:flex;flex-direction:column;
    background:linear-gradient(164deg,rgba(19,27,44,.95) 0%,rgba(9,13,22,.97) 100%);
    border:1px solid rgba(140,170,215,.14);
    box-shadow:0 24px 50px -34px #000, inset 0 1px 0 rgba(255,255,255,.045);
    transition:transform .18s ease,box-shadow .22s,border-color .22s,opacity .25s;
  }
  .node::before{
    content:"";position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 10%,transparent));
  }
  .node:hover{
    transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 48%,transparent);
    box-shadow:0 30px 60px -40px #000, 0 0 30px -18px var(--ac), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .node.sel{
    border-color:color-mix(in srgb,var(--ac) 78%,transparent);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 45%,transparent),0 0 44px -22px var(--ac);
  }
  .node.active{
    border-color:var(--ac);transform:translateY(-3px);
    box-shadow:0 0 0 1px var(--ac),0 0 52px -20px var(--ac);
  }
  .node.dim{opacity:.2;filter:saturate(.35)}
  .node .ring{position:absolute;inset:-1px;border-radius:15px;border:1px solid var(--ac);opacity:0;pointer-events:none}
  .node.active .ring{animation:ring 1.8s ease-out infinite}
  @keyframes ring{0%{opacity:.6;transform:scale(1)}72%{opacity:0;transform:scale(1.028)}100%{opacity:0}}

  .nhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .num{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:2px 5px;border-radius:5px;
    color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--ac) 32%,transparent);
  }
  .nphase{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:#6c7f99;margin-left:auto;text-transform:uppercase}
  .ntitle{font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.22;color:#eef4ff}
  .nsub{
    font-size:12px;line-height:1.62;color:#8798b0;margin-top:7px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .nfoot{margin-top:auto;padding-top:9px;display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden}
  .tag{
    font-family:var(--mono);font-size:9px;color:#7d8ea6;white-space:nowrap;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
    border-radius:4px;padding:2px 5px;
  }
  .ghost{
    position:absolute;right:10px;bottom:-14px;font-family:var(--mono);font-weight:800;
    font-size:78px;line-height:1;letter-spacing:-.04em;pointer-events:none;
    color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--ac) 26%,transparent);
    opacity:.55;
  }

  /* row captions */
  .rowcap{
    position:absolute;left:44px;display:flex;align-items:baseline;gap:10px;pointer-events:none;
  }
  .rowcap .p{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--pc);
    border:1px solid color-mix(in srgb,var(--pc) 30%,transparent);
    background:color-mix(in srgb,var(--pc) 8%,transparent);
    border-radius:5px;padding:2px 6px;
  }
  .rowcap .d{font-size:11.5px;color:#67788f;letter-spacing:.01em}
  .rowcap .rule{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 26%,transparent),transparent 70%);top:22px}

  .foot{
    position:absolute;display:flex;align-items:center;gap:14px;
    font-family:var(--mono);font-size:9.5px;color:#4f6080;letter-spacing:.08em;
  }
  .foot b{color:#7f93ad;font-weight:500}

  /* ---------------- console ---------------- */
  .console{
    position:fixed;right:18px;bottom:14px;z-index:25;width:min(600px,calc(100vw - 36px));
    background:rgba(7,11,19,.9);border:1px solid rgba(140,170,215,.16);border-radius:12px;
    backdrop-filter:blur(12px);box-shadow:0 24px 60px -30px #000;overflow:hidden;
    transition:.22s;
  }
  .console.collapsed .c-body{height:0;padding-top:0;padding-bottom:0;border-top-color:transparent}
  .c-head{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid rgba(140,170,215,.1)}
  .c-head .dot{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
  .c-head .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:#7f93ad}
  .c-head .sp{margin-left:auto;display:flex;gap:6px}
  .c-head button{padding:2px 8px;font-size:10px;border-radius:6px}
  .c-body{
    height:132px;overflow:auto;padding:8px 11px 10px;border-top:1px solid rgba(140,170,215,.08);
    font-family:var(--mono);font-size:10.5px;line-height:1.75;transition:.22s;
  }
  .c-body .ln{white-space:pre-wrap;word-break:break-word}
  .c-body .dim{color:#5f708a}
  .c-body .ok{color:#5eead4}
  .c-body .err{color:#fb7185}
  .c-body .warn{color:#fbbf24}
  .c-body .cmd{color:#93c5fd}
  .c-body .say{color:#c7d5e8;font-family:inherit;font-size:11px}

  /* ---------------- drawer ---------------- */
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(486px,92vw);z-index:40;
    background:linear-gradient(180deg,rgba(11,16,26,.985),rgba(6,9,15,.99));
    border-left:1px solid rgba(140,170,215,.16);
    box-shadow:-40px 0 80px -50px #000;
    transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0)}
  .d-head{padding:16px 18px 12px;border-bottom:1px solid rgba(140,170,215,.1);position:relative;flex:none}
  .d-meta{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .d-meta .num{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:2px 5px;border-radius:5px}
  .d-meta .f{font-family:var(--mono);font-size:9.5px;color:#5f708a;letter-spacing:.02em}
  .d-head h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;color:#eef4ff;padding-right:30px}
  .d-close{
    position:absolute;right:14px;top:14px;width:26px;height:26px;padding:0;justify-content:center;
    border-radius:7px;font-size:12px;
  }
  .d-body{flex:1;overflow:auto;padding:16px 18px 40px}
  .d-body::-webkit-scrollbar{width:8px}
  .d-body::-webkit-scrollbar-thumb{background:rgba(140,170,215,.18);border-radius:8px}
  .sec{margin-bottom:19px}
  .sec-h{
    font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:#4f6080;
    text-transform:uppercase;margin-bottom:7px;
  }
  .one{
    font-size:12.5px;line-height:1.72;color:#c8d6ea;
    border-left:2px solid var(--ac);padding:2px 0 2px 11px;
  }
  .d-body p{margin:0 0 9px;font-size:12px;line-height:1.78;color:#93a3bb}
  .d-body p:last-child{margin-bottom:0}
  .io{display:grid;grid-template-columns:1fr;gap:7px}
  .io .row{display:flex;gap:9px;font-size:11.5px;line-height:1.6}
  .io .k{
    font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#5f708a;
    padding-top:3px;flex:none;width:30px;
  }
  .io .v{color:#a9b8ce}
  pre.code{
    margin:0;padding:11px 13px;border-radius:9px;overflow:auto;
    background:#060a11;border:1px solid rgba(140,170,215,.13);
    font-family:var(--mono);font-size:10.8px;line-height:1.72;color:#a9c7e8;
    border-left:2px solid color-mix(in srgb,var(--ac) 60%,transparent);
  }
  pre.code::-webkit-scrollbar{height:7px}
  pre.code::-webkit-scrollbar-thumb{background:rgba(140,170,215,.18);border-radius:8px}
  ul.pits{margin:0;padding:0;list-style:none}
  ul.pits li{
    position:relative;padding-left:14px;margin-bottom:7px;font-size:11.8px;line-height:1.72;color:#93a3bb;
  }
  ul.pits li::before{content:"▸";position:absolute;left:0;top:0;color:color-mix(in srgb,var(--ac) 70%,transparent);font-size:10px}
  .rel{display:flex;flex-wrap:wrap;gap:6px}
  .rel button{
    font-size:10.5px;padding:4px 8px;border-radius:6px;
    font-family:var(--mono);color:#8fa3bd;background:rgba(255,255,255,.03);
  }
  .rel button:hover{color:#eaf2ff;border-color:color-mix(in srgb,var(--ac) 40%,transparent)}

  .hint{
    position:fixed;left:18px;bottom:16px;z-index:20;font-family:var(--mono);
    font-size:9.5px;color:#41506b;letter-spacing:.08em;pointer-events:none;
  }
  @media (max-width:1180px){
    .legend .chip .n{display:none}
    .t2{display:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo mono">◈</div>
    <div>
      <div class="t1 mono">AGENTLAB <span>/ RUNTIME FLOW</span></div>
      <div class="t2">一条命令 → 一个可复算的分数 · 12 个模块按真实执行顺序排列</div>
    </div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="acts">
    <span class="prog mono" id="prog"></span>
    <button id="playBtn">▶ 播放一集</button>
    <button id="fitBtn">适配</button>
    <span class="zoomval mono" id="zoomVal">100%</span>
  </div>
</div>

<div class="stage">
  <div id="viewport">
    <div id="canvas">
      <svg id="edges"></svg>
      <div id="deco"></div>
      <div id="nodes"></div>
    </div>
  </div>
</div>

<div class="console collapsed" id="console">
  <div class="c-head">
    <span class="dot"></span>
    <span class="t">TRACE · rb-fault-retry</span>
    <span class="sp">
      <button id="cClear">清空</button>
      <button id="cToggle">展开</button>
    </span>
  </div>
  <div class="c-body" id="cBody"><div class="ln dim">// 点「播放一集」看一个真实 episode 走完全流程</div></div>
</div>

<div class="hint mono">拖拽平移 · 滚轮缩放 · ← → 单步 · 空格播放</div>

<aside class="drawer" id="drawer">
  <div class="d-head">
    <div class="d-meta">
      <span class="num mono" id="dNum">01</span>
      <span class="f mono" id="dFile">agentlab/cli.py</span>
    </div>
    <h2 id="dTitle">—</h2>
    <button class="d-close" id="dClose">✕</button>
  </div>
  <div class="d-body" id="dBody"></div>
</aside>

<script>
/* ============================================================
   阶段定义
   ============================================================ */
const PHASES = {
  p1:{ name:'准备',  c:'#38bdf8' },
  p2:{ name:'闭环',  c:'#34d399' },
  p3:{ name:'结算',  c:'#a78bfa' }
};

const ROWCAPS = [
  { y:18,  phase:'p1', k:'PHASE 01', d:'把一行命令，变成一堆待跑的 episode —— 每个都带着自己的干净房间和初始文件' },
  { y:290, phase:'p2', k:'PHASE 02', d:'唯一会循环的阶段：观测 → 动作 → 执行（本行自右向左编号 05 → 08）；轨迹、故障、指标素材全在这里产生' },
  { y:562, phase:'p3', k:'PHASE 03', d:'判完分之后：算总账、落成可回放的产物，再决定这一批数字能不能信' }
];

/* ============================================================
   节点（严格按运行时序 01 → 12）
   ============================================================ */
const NODES = [
  {
    id:'cli', n:'01', phase:'p1', ac:'#38bdf8', x:44, y:52,
    title:'敲下一条命令',
    sub:'解析子命令与参数，选好 agent 策略，然后把控制权交给 runner。',
    tags:['cli.py','main()','5 个子命令'],
    file:'agentlab/cli.py',
    one:'整个项目唯一需要记住的入口。它只做一件事：把终端参数变成一次函数调用。',
    desc:[
      'cli.py 里没有任何评测逻辑。build_parser() 声明五个子命令（list / validate / run / report / doctor），main() 把 argv 解析成 Namespace，再调用对应的 cmd_* 函数。',
      '拆开的收益很直接：评测逻辑可以被子进程或脚本直接 import 复用，CLI 只是一层薄壳。退出码还能反映结果 —— validate 只要有一个任务不合法就返回 1，CI 可以直接卡住。'
    ],
    io:{ in:'终端参数：run --suite rebound --agent scripted --samples 2', out:'RunConfig / 任务清单 / 退出码' },
    code:`def main(argv=None):
    args = build_parser().parse_args(argv)
    return int(args.func(args))

# 子命令只绑定一个函数，逻辑都在别处
run_p.add_argument("--suite")
run_p.add_argument("--samples", type=int, default=1)
run_p.set_defaults(func=cmd_run)`,
    pits:[
      'rich 只是可选的美化依赖：导入失败会自动退化成 print，不会挡住主流程。',
      '子命令用 required=True 强制指定，敲错直接报 usage，而不是静默跑一个默认动作。'
    ],
    rel:['registry','paths']
  },
  {
    id:'registry', n:'02', phase:'p1', ac:'#38bdf8', x:464, y:52,
    title:'把任务包装进内存',
    sub:'扫 suites/*/*/task.yaml，用 Pydantic 严格校验，错一条就整批拒绝开跑。',
    tags:['registry.py','spec.py','extra=forbid'],
    file:'agentlab/core/registry.py',
    one:'扫目录 → 读 YAML → 校验。任何一条不合法，整批任务拒绝启动。',
    desc:[
      'Registry 遍历 suites/<环境域>/<任务>/task.yaml，每个文件交给 load_task() 解析成 TaskSpec。',
      '校验是刻意的严格：extra=forbid（字段名拼错直接报错）、id 必须等于目录名、category / difficulty 必须命中枚举、声明了 faults 就必须属于 rebound 类。任务写错要在开跑前炸掉，而不是跑完十分钟才发现判分永远是 False。'
    ],
    io:{ in:'suites/ 目录树（18 个任务 / 4 个环境域）', out:'list[LoadedTask]，每个都带着自己的 root 目录' },
    code:`class Registry:
    def scan(self):
        for d in sorted(suites_dir.glob("*/*")):
            self.tasks.append(load_task(d))   # 失败即报错
        return self

spec = TaskSpec.model_validate(raw)      # extra="forbid"
if spec.id != root.name:                 # id 必须等于目录名
    raise SpecError(...)`,
    pits:[
      '任务 id 与目录名字面不一致，是最常见的加载报错。',
      '加载错误汇总打印后直接抛 RuntimeError —— 不做「跳过坏任务继续跑」的妥协。'
    ],
    rel:['cli','paths']
  },
  {
    id:'paths', n:'03', phase:'p1', ac:'#38bdf8', x:884, y:52,
    title:'建跑道、铺并发',
    sub:'算 run_id、建结果目录、写 run_meta（含任务指纹），再把任务 × 采样丢进线程池。',
    tags:['runner.py','RunPaths','ThreadPool'],
    file:'agentlab/eval/runner.py',
    one:'先建好本次运行的家，再把「任务 × 采样」铺开并行。',

function roundPath(pts, r) {
  const f = v => Math.round(v * 10) / 10;
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i-1], p1 = pts[i], p2 = pts[i+1];
    const v1 = [p1[0]-p0[0], p1[1]-p0[1]], v2 = [p2[0]-p1[0], p2[1]-p1[1]];
    const l1 = Math.hypot(v1[0], v1[1]) || 1, l2 = Math.hypot(v2[0], v2[1]) || 1;
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const a = [p1[0] - v1[0]/l1*rr, p1[1] - v1[1]/l1*rr];
    const b = [p1[0] + v2[0]/l2*rr, p1[1] + v2[1]/l2*rr];
    d += `L${f(a[0])},${f(a[1])}Q${f(p1[0])},${f(p1[1])} ${f(b[0])},${f(b[1])}`;
  }
  const last = pts[pts.length-1];
  d += `L${f(last[0])},${f(last[1])}`;
  return d;
}

function label(x, y, text, anchor, cls) {
  const t = svgEl('text', { x, y, class: 'elabel' + (cls ? ' ' + cls : ''), 'text-anchor': anchor || 'middle' });
  t.textContent = text;
  svg.appendChild(t);
  return t;
}

/* ---- 主流程连线 ---- */
function drawMain() {
  for (let i = 0; i < SEQ.length - 1; i++) {
    const a = byId(SEQ[i]), b = byId(SEQ[i+1]);
    const sameRow = Math.abs(a.y - b.y) < 1;
    let pts, lx, ly, txt;

    if (sameRow) {
      const rightward = b.x > a.x;
      const cy = a.y + NH / 2;
      pts = rightward ? [[a.x + NW, cy], [b.x, cy]] : [[a.x, cy], [b.x + NW, cy]];
      txt = '';
    } else if (a.id === 'taxo') {
      // 08 → 09：走左侧外沿，避开这一行的说明文字
      const y0 = a.y + NH / 2, y1 = b.y + NH / 2;
      pts = [[a.x, y0], [16, y0], [16, y1], [b.x, y1]];
      txt = '';
    } else {
      const cx = a.x + NW / 2;
      pts = [[cx, a.y + NH], [cx, b.y]];
      lx = cx + 11;
      ly = b.y - 11;
      txt = '↓ 一个 episode 开始';
    }
    const p = svgEl('path', { d: roundPath(pts, 10), class:'edge', 'marker-end': ARROW });
    p.dataset.from = a.id; p.dataset.to = b.id;
    svg.appendChild(p);
    if (txt) label(lx, ly, txt, 'start');
  }
}

/* ---- 05 / 06 的循环回边：执行完拿到新观测，回头再决策 ---- */
function drawLoopBack() {
  const a = byId('agent'), b = byId('tools');   // 05 在右，06 在左
  const cxA = a.x + NW / 2, cxB = b.x + NW / 2, y0 = a.y + NH, y1 = y0 + 20;
  const pts = [[cxB, y0], [cxB, y1], [cxA, y1], [cxA, y0]];
  svg.appendChild(svgEl('path', { d: roundPath(pts, 12), class:'edge dash', 'marker-end': ARROW_W }));
  label(cxA, y1 + 18, '同一 episode 内循环：执行完 → 新观测回到 Agent，直到 finish / 预算耗尽', 'end');
}

/* ---- 底部回环 ---- */
function drawLoopback() {
  const a = byId('rl');
  const x = a.x + NW / 2, y0 = a.y + NH, y1 = 848;
  const pts = [[x, y0], [x, y1], [110, y1]];
  svg.appendChild(svgEl('path', { d: roundPath(pts, 14), class:'edge dash', 'marker-end': ARROW }));
  label(96, y1 - 9, '一轮 run 结束 —— 换 policy / 调预算 / 改任务后重跑；指纹变了，分数不能直接比', 'start');
}

/* ---- 行说明 ---- */
function drawRows() {
  ROWCAPS.forEach(r => {
    const c = PHASES[r.phase].c;
    const d = document.createElement('div');
    d.className = 'rowcap';
    d.style.top = r.y + 'px';
    d.style.setProperty('--pc', c);
    d.innerHTML = `<span class="p">${r.k}</span><span class="d">${esc(r.d)}</span>`;
    decoEl.appendChild(d);
  });

  const foot = document.createElement('div');
  foot.className = 'foot';
  foot.style.left = '44px';
  foot.style.top = '872px';
  foot.innerHTML = '<span>— 主流程</span><span>┄ 回环 / 旁路</span><span>点击卡片看通俗解释与代码</span>';
  decoEl.appendChild(foot);
}

/* ---- 节点 ---- */
function renderNodes() {
  NODES.forEach(n => {
    const el = document.createElement('div');
    el.className = 'node';
    el.dataset.id = n.id;
    el.style.cssText = `left:${n.x}px;top:${n.y}px;width:${NW}px;height:${NH}px;--ac:${n.ac}`;
    el.innerHTML = `
      <div class="ring"></div>
      <div class="nhead">
        <span class="num mono">${n.n}</span>
        <span class="nphase mono">${PHASES[n.phase].name}</span>
      </div>
      <div class="ntitle">${esc(n.title)}</div>
      <div class="nsub">${esc(n.sub)}</div>
      <div class="nfoot">${n.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="ghost mono">${n.n}</div>`;
    el.addEventListener('click', () => openNode(n.id));
    nodesEl.appendChild(el);
  });
}

/* ============================================================
   抽屉
   ============================================================ */
let selected = null;

function openNode(id) {
  const n = byId(id);
  if (!n) return;
  if (playing) stopPlay();
  selected = id;

  document.querySelectorAll('.node').forEach(el => el.classList.toggle('sel', el.dataset.id === id));

  drawer.style.setProperty('--ac', n.ac);
  document.getElementById('dNum').textContent = n.n;
  document.getElementById('dNum').style.cssText =
    `color:${n.ac};background:color-mix(in srgb,${n.ac} 12%,transparent);border:1px solid color-mix(in srgb,${n.ac} 32%,transparent)`;
  document.getElementById('dFile').textContent = n.file;
  document.getElementById('dTitle').textContent = n.title;

  const rel = (n.rel || []).map(r => {
    const t = byId(r);
    return t ? `<button data-go="${t.id}">${t.n} ${esc(t.title)}</button>` : '';
  }).join('');

  document.getElementById('dBody').innerHTML = `
    <div class="sec">
      <div class="one" style="border-color:${n.ac}">${esc(n.one)}</div>
    </div>
    <div class="sec">
      <div class="sec-h">它在做什么</div>
      ${n.desc.map(p => `<p>${esc(p)}</p>`).join('')}
    </div>
    <div class="sec">
      <div class="sec-h">输入 / 输出</div>
      <div class="io">
        <div class="row"><span class="k mono">IN</span><span class="v">${esc(n.io.in)}</span></div>
        <div class="row"><span class="k mono">OUT</span><span class="v">${esc(n.io.out)}</span></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-h">关键代码（简化）</div>
      <pre class="code" style="border-left-color:${n.ac}">${esc(n.code)}</pre>
    </div>
    <div class="sec">
      <div class="sec-h">坑与设计取舍</div>
      <ul class="pits">${n.pits.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    </div>
    <div class="sec">
      <div class="sec-h">相关模块</div>
      <div class="rel">${rel}</div>
    </div>`;

  document.getElementById('dBody').querySelectorAll('[data-go]').forEach(b => {
    b.addEventListener('click', () => { openNode(b.dataset.go); focusNode(b.dataset.go); });
  });

  drawer.classList.add('open');
  focusNode(id, true);
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}

function closeDrawer() {
  drawer.classList.remove('open');
  selected = null;
  document.querySelectorAll('.node').forEach(el => el.classList.remove('sel'));
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (!playing) fit();
}
document.getElementById('dClose').addEventListener('click', closeDrawer);

/* ============================================================
   视图：缩放 / 平移
   ============================================================ */
let k = 1, tx = 0, ty = 0;

function apply() {
  canvas.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
  document.getElementById('zoomVal').textContent = Math.round(k * 100) + '%';
}

function fit() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  k = Math.min((vw - 48) / W, (vh - 48) / H, 1.08);
  tx = (vw - W * k) / 2;
  ty = (vh - H * k) / 2 + 6;
  apply();
}

function focusNode(id, soft) {
  const n = byId(id);
  if (!n) return;
  const vw = viewport.clientWidth - (drawer.classList.contains('open') ? 486 : 0);
  const vh = viewport.clientHeight - (consoleEl.classList.contains('collapsed') ? 0 : 150);
  const targetK = Math.min(1.0, Math.max(0.82, Math.min((vw - 90) / NW, (vh - 190) / NH)));
  k = targetK;
  tx = vw / 2 - (n.x + NW / 2) * k;
  ty = vh / 2 - (n.y + NH / 2) * k + 26;
  apply();
}

/* 拖拽 */
let drag = null;
viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('.node')) return;
  drag = { x:e.clientX, y:e.clientY, tx, ty };
  viewport.classList.add('dragging');
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  tx = drag.tx + (e.clientX - drag.x);
  ty = drag.ty + (e.clientY - drag.y);
  apply();
});
window.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); });

/* 滚轮缩放 */
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const r = viewport.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const nk = Math.min(1.6, Math.max(0.28, k * (e.deltaY < 0 ? 1.08 : 0.926)));
  tx = mx - (mx - tx) * (nk / k);
  ty = my - (my - ty) * (nk / k);
  k = nk;
  apply();
}, { passive:false });

window.addEventListener('resize', () => {
  if (selected) focusNode(selected);
  else fit();
});

/* ============================================================
   阶段筛选
   ============================================================ */
function buildLegend() {
  const box = document.getElementById('legend');
  Object.keys(PHASES).forEach(p => {
    const c = PHASES[p].c;
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.p = p;
    b.style.setProperty('--c', c);
    b.innerHTML = `<i></i>${PHASES[p].name}<span class="n"> · ${NODES.filter(n => n.phase === p).length}</span>`;
    b.addEventListener('click', () => {
      const on = b.classList.toggle('on');
      box.querySelectorAll('.chip').forEach(x => { if (x !== b) x.classList.remove('on'); });
      const active = on ? p : null;
      document.querySelectorAll('.node').forEach(el => {
        const nd = byId(el.dataset.id);
        el.classList.toggle('dim', active !== null && nd.phase !== active);
      });
      document.querySelectorAll('.rowcap').forEach(el => el.style.opacity = 1);
    });
    box.appendChild(b);
  });
}

/* ============================================================
   播放
   ============================================================ */
let playIdx = -1, playing = false, timer = null;

function addTrace(list) {
  consoleEl.classList.remove('collapsed');
  document.getElementById('cToggle').textContent = '收起';
  list.forEach(([cls, text]) => {
    const d = document.createElement('div');
    d.className = 'ln ' + cls;
    d.textContent = text;
    cBody.appendChild(d);
  });
  cBody.scrollTop = cBody.scrollHeight;
}

function setStepText() {
  document.getElementById('prog').textContent =
    playIdx >= 0 ? `STEP ${String(playIdx + 1).padStart(2, '0')} / 12` : '';
}

function gotoStep(i) {
  document.querySelectorAll('.node').forEach(el => el.classList.remove('active'));
  const s = PLAY[i];
  const el = document.querySelector(`.node[data-id="${s.id}"]`);
  if (el) el.classList.add('active');
  focusNode(s.id);
  addTrace([['say', `› ${s.say}`]].concat(s.trace));
  playIdx = i;
  setStepText();
}

function startPlay() {
  clearInterval(timer);
  document.querySelectorAll('.node').forEach(el => el.classList.remove('active'));
  cBody.innerHTML = '';
  consoleEl.classList.remove('collapsed');
  document.getElementById('cToggle').textContent = '收起';
  playIdx = -1;
  gotoStep(0);
  playing = true;
  document.getElementById('playBtn').textContent = '❚❚ 暂停';
  timer = setInterval(() => {
    if (playIdx + 1 >= PLAY.length) { stopPlay(); return; }
    gotoStep(playIdx + 1);
    if (playIdx === PLAY.length - 1) stopPlay();
  }, 2300);
}

function stopPlay() {
  clearInterval(timer);
  playing = false;
  document.getElementById('playBtn').textContent = '▶ 播放一集';
}

document.getElementById('playBtn').addEventListener('click', () => {
  if (playing) stopPlay(); else startPlay();
});
document.getElementById('fitBtn').addEventListener('click', () => { closeDrawer(); fit(); });
document.getElementById('cToggle').addEventListener('click', () => {
  const c = consoleEl.classList.toggle('collapsed');
  document.getElementById('cToggle').textContent = c ? '展开' : '收起';
});
document.getElementById('cClear').addEventListener('click', () => {
  cBody.innerHTML = '<div class="ln dim">// 已清空</div>';
});

/* 键盘 */
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (drawer.classList.contains('open')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === ' ') {
    e.preventDefault();
    if (e.key === ' ') { playing ? stopPlay() : startPlay(); return; }
    if (playing) stopPlay();
    const delta = e.key === 'ArrowRight' ? 1 : -1;
    const next = Math.min(PLAY.length - 1, Math.max(0, (playIdx < 0 ? 0 : playIdx) + delta));
    gotoStep(next);
  }
});

/* ============================================================
   启动
   ============================================================ */
drawMain();
drawLoopBack();
drawLoopback();
drawRows();
renderNodes();
buildLegend();
fit();

const hash = location.hash.replace('#', '');
if (hash === 'play') {
  setTimeout(startPlay, 500);
} else if (hash && byId(hash)) {
  openNode(hash);
} else {
  setTimeout(() => {
    if (!playing && !selected) {
      document.querySelector('.node').classList.add('sel');
    }
  }, 200);
}
</script>
</body>
</html>
